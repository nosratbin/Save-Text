<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveText: Save and Share Text Online for Free</title>
    <meta name="description" content="Paste text, set an expiry and get a shareable link in seconds. SaveText is a free online notepad with no sign-up needed.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://save-text.onrender.com/">
    <!-- Open Graph Tags -->
    <meta property="og:title" content="SaveText: Save and Share Text Online for Free">
    <meta property="og:description" content="Paste text, set an expiry and get a shareable link in seconds. SaveText is a free online notepad with no sign-up needed.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://save-text.onrender.com/">
    <meta property="og:image" content="https://save-text.onrender.com/og-image.png">
    <meta property="og:site_name" content="SaveText">
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SaveText: Save and Share Text Online for Free">
    <meta name="twitter:description" content="Paste text, set an expiry and get a shareable link in seconds. SaveText is a free online notepad with no sign-up needed.">
    <meta name="twitter:image" content="https://save-text.onrender.com/og-image.png">
    <!-- Structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "WebSite",
                "name": "SaveText",
                "url": "https://save-text.onrender.com/"
            },
            {
                "@type": "WebApplication",
                "name": "SaveText",
                "url": "https://save-text.onrender.com/",
                "applicationCategory": "UtilitiesApplication",
                "operatingSystem": "Any",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
            }
        ]
    }
    </script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="/theme.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="app min-h-screen flex">
    <!-- Sidebar -->
    <div id="side-menu" class="sidebar fixed inset-y-0 left-0 w-64 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col z-40">
        <div class="px-4 h-16 flex justify-between items-center">
            <h2 class="sidebar-title">
                <svg width="16" height="20" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <rect x="0" y="0" width="24" height="30" rx="3" ry="3" fill="#ededed" />
                  <rect x="5" y="6" width="14" height="2" fill="#85858b" />
                  <rect x="5" y="12" width="14" height="2" fill="#85858b" />
                  <rect x="5" y="18" width="10" height="2" fill="#85858b" />
                </svg>
                Saved texts
              </h2>
            <!-- Close Button for Mobile -->
            <button id="sidebar-close-btn" class="icon-btn md:hidden hidden" onclick="toggleSideMenu()" aria-label="Close menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="auth-section" class="px-4">
            <button id="login-btn" onclick="window.location.href='/login'" class="btn btn-small">Log in</button>
            <button id="logout-btn" onclick="logout()" class="btn btn-small hidden">Log out</button>
        </div>
        <div class="flex-1 overflow-y-auto pb-4">
            <h3 id="my-texts-header" class="side-label side-label-mine hidden">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM5 21a7 7 0 0114 0"></path>
                </svg>
                My texts
            </h3>
            <ul id="my-texts" class="side-list side-list-mine"></ul>
            <h3 class="side-label">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 21a9 9 0 100-18 9 9 0 000 18zM3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"></path>
                </svg>
                Public texts
            </h3>
            <ul id="public-texts" class="side-list"></ul>
        </div>
        <nav class="side-footer" aria-label="About SaveText">
            <a href="/about">About</a>
            <a href="/faq">FAQ</a>
            <a href="/privacy">Privacy</a>
        </nav>
    </div>
    <!-- Menu Toggle Button (Hamburger) -->
    <button id="menu-btn" class="icon-btn md:hidden fixed top-4 left-4 z-50" onclick="toggleSideMenu()" aria-label="Open menu">
        <svg id="menu-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
    <!-- Main Content -->
    <main class="flex-1 min-w-0 flex justify-center items-center min-h-screen px-4 pt-20 pb-6 md:p-8 md:ml-64">
        <div class="card w-full max-w-2xl">
            <svg width="160" height="40" viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg" class="mx-auto mb-6" style="overflow: visible" role="img" aria-label="SaveText">
                <!-- Document Icon -->
                <g transform="translate(0, 5)">
                  <rect x="0" y="0" width="24" height="30" rx="3" ry="3" fill="#CBD5E1"></rect>
                  <rect x="5" y="6" width="14" height="2" fill="#94A3B8"></rect>
                  <rect x="5" y="12" width="14" height="2" fill="#94A3B8"></rect>
                  <rect x="5" y="18" width="10" height="2" fill="#94A3B8"></rect>
                </g>
                <!-- Logo Text -->
                <text x="34" y="30" font-family="Segoe UI, sans-serif" font-size="30" font-weight="bold">
                  <tspan fill="#3B82F6">Save</tspan><tspan fill="#EF4444">Text</tspan>
                </text>
            </svg>

            <h1 class="visually-hidden">Save and share text online</h1>
            <p class="visually-hidden">Paste your text, pick an expiry and get a link to share. No account needed.</p>

            <input type="text" id="title" placeholder="Title" aria-label="Title" class="field">
            <textarea id="content" placeholder="Write or paste text" aria-label="Text" class="field h-48"></textarea>
            <select id="expireOption" aria-label="Expiration" class="field">
                <option value="no expire">No expiry</option>
                <option value="1 year">1 year</option>
                <option value="1 month">1 month</option>
                <option value="1 week">1 week</option>
                <option value="1 day">1 day</option>
                <option value="1 hour">1 hour</option>
            </select>
            <div class="actions">
                <button onclick="saveText()" class="btn btn-primary">Save</button>
                <button onclick="copyText()" class="btn">Copy</button>
                <button onclick="pasteText()" class="btn">Paste</button>
                <button onclick="viewRaw()" class="btn">View raw</button>
                <button onclick="deleteText()" class="btn btn-danger actions-end">Delete</button>
            </div>
            <p id="notice" class="notice" role="status"></p>
            <div id="result" class="result" hidden>
                <div class="result-meta">
                    <span>Saved</span>
                    <span id="result-expiry" class="result-expiry"></span>
                </div>
                <a id="result-link" class="result-link" href="#"><span id="result-base"></span><span id="result-id" class="result-id"></span></a>
            </div>
        </div>
    </main>

    <script>
        let token = localStorage.getItem('token');
        let savedUrl = '';

        function notify(message, tone) {
            const notice = document.getElementById('notice');
            notice.textContent = message;
            notice.dataset.tone = tone || '';
        }

        function showResult(uniqueId, expireOption) {
            const base = `${window.location.origin}/api/texts/`;
            savedUrl = `${base}${uniqueId}`;
            document.getElementById('result-link').href = savedUrl;
            document.getElementById('result-base').textContent = base;
            document.getElementById('result-id').textContent = uniqueId;
            document.getElementById('result-expiry').textContent =
                expireOption === 'no expire' ? 'No expiry' : `Expires in ${expireOption}`;
            document.getElementById('result').hidden = false;
        }

        function clearResult() {
            savedUrl = '';
            document.getElementById('result').hidden = true;
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            updateUI();
            fetchSavedTexts();
        }

        function updateUI() {
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const myTextsHeader = document.getElementById('my-texts-header');
            if (token) {
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                myTextsHeader.classList.remove('hidden');
            } else {
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                myTextsHeader.classList.add('hidden');
            }
        }

        async function fetchSavedTexts() {
            try {
                const headers = token ? { Authorization: `Bearer ${token}` } : {};
                const response = await fetch('/api/texts', { headers });
                if (!response.ok) {
                    throw new Error('Failed to fetch saved texts');
                }
                const data = await response.json();
                const myTextsContainer = document.getElementById('my-texts');
                const publicTextsContainer = document.getElementById('public-texts');
                myTextsContainer.innerHTML = '';
                publicTextsContainer.innerHTML = '';

                const addTextToList = (container, texts) => {
                    texts.forEach((text) => {
                        const listItem = document.createElement('li');

                        const link = document.createElement('a');
                        link.href = `${window.location.origin}/api/texts/${text.uniqueId}`;
                        link.className = 'side-link';
                        link.rel = 'nofollow ugc';

                        const title = document.createElement('span');
                        title.textContent = text.title;
                        title.className = 'side-link-title';
                        link.appendChild(title);

                        listItem.appendChild(link);
                        container.appendChild(listItem);
                    });
                };

                if (token) {
                    addTextToList(myTextsContainer, data.myTexts);
                }
                addTextToList(publicTextsContainer, data.publicTexts);
            } catch (error) {
                console.error(error);
            }
        }

        window.addEventListener('load', () => {
            updateUI();
            fetchSavedTexts();
        });

        async function saveText() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const expireOption = document.getElementById('expireOption').value;

            if (!title || !content) {
                notify('Add a title and some text first', 'error');
                return;
            }

            const headers = token ? {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            } : { 'Content-Type': 'application/json' };

            const response = await fetch('/api/texts/save', {
                method: 'POST',
                headers,
                body: JSON.stringify({ title, content, expireOption })
            });

            if (!response.ok) {
                notify('Could not save the text. Try again', 'error');
                return;
            }

            const result = await response.json();
            notify('');
            showResult(result.url, expireOption);
            fetchSavedTexts();
        }

        function copyText() {
            const content = document.getElementById('content');
            content.select();
            document.execCommand('copy');
        }

        function pasteText() {
            navigator.clipboard.readText().then(text => {
                document.getElementById('content').value = text;
            });
        }

        function viewRaw() {
            if (savedUrl) {
                window.open(`${savedUrl}/raw`, '_blank');
            } else {
                notify('Save a text first', 'error');
            }
        }

        async function deleteText() {
            if (!savedUrl) {
                notify('Save a text first', 'error');
                return;
            }
            if (!confirm('Delete this text?')) {
                return;
            }
            const uniqueId = savedUrl.split('/').pop();
            const headers = token ? { Authorization: `Bearer ${token}` } : {};
            const response = await fetch(`/api/texts/${uniqueId}`, {
                method: 'DELETE',
                headers
            });
            if (!response.ok) {
                notify('Could not delete the text', 'error');
                return;
            }
            clearResult();
            notify('Text deleted');
            fetchSavedTexts();
        }

        function toggleSideMenu() {
            const sideMenu = document.getElementById('side-menu');
            const menuBtn = document.getElementById('menu-btn');
            const sidebarCloseBtn = document.getElementById('sidebar-close-btn');

            sideMenu.classList.toggle('-translate-x-full');
            const isSideMenuOpen = !sideMenu.classList.contains('-translate-x-full');

            if (isSideMenuOpen) {
                menuBtn.classList.add('hidden');
                sidebarCloseBtn.classList.remove('hidden');
            } else {
                menuBtn.classList.remove('hidden');
                sidebarCloseBtn.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
