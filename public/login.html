<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SaveText</title>
    <meta name="description" content="Log in to SaveText to keep your saved texts under your own account.">
    <meta name="robots" content="noindex, follow">
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Login - SaveText">
    <meta property="og:description" content="Log in to SaveText to keep your saved texts under your own account.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://save-text.onrender.com/login">
    <meta property="og:image" content="https://save-text.onrender.com/og-image.png">
    <meta property="og:site_name" content="SaveText">
   <!-- Twitter Card Tags -->
   <meta name="twitter:card" content="summary_large_image">
   <meta name="twitter:title" content="Login - SaveText">
   <meta name="twitter:description" content="Log in to SaveText to keep your saved texts under your own account.">
       <!-- Favicon -->
       <link rel="icon" type="image/svg+xml" href="/favicon.svg">
       <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
       <link href="/theme.css" rel="stylesheet">
       <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="app min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md">
        <svg width="160" height="40" viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg" class="mx-auto mb-6" style="overflow: visible">
            <!-- Document Icon -->
            <g transform="translate(0, 5)">
              <rect x="0" y="0" width="24" height="30" rx="3" ry="3" fill="#CBD5E1"></rect>
              <rect x="5" y="6" width="14" height="2" fill="#94A3B8"></rect>
              <rect x="5" y="12" width="14" height="2" fill="#94A3B8"></rect>
              <rect x="5" y="18" width="10" height="2" fill="#94A3B8"></rect>
            </g>
            <!-- Logo Text -->
            <text x="34" y="30" font-family="Segoe UI, sans-serif" font-size="30" font-weight="bold">
              <tspan fill="#3B82F6">Save</tspan><tspan fill="#EF4444">Text</tspan>
            </text>
        </svg>
        <h2 class="subtitle text-center mb-4">Log in or sign up to keep your own texts</h2>
        <input type="text" id="username" placeholder="Username" aria-label="Username" autocomplete="username" class="field">
        <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" class="field">
        <div class="actions">
            <button onclick="login()" class="btn btn-primary btn-block">Log in</button>
            <button onclick="signup()" class="btn btn-block">Sign up</button>
        </div>
        <p id="notice" class="notice" role="status"></p>
        <p class="mt-4 text-center"><a href="/" class="text-link">Back to home</a></p>
    </div>
    <script>
        function notify(message, tone) {
            const notice = document.getElementById('notice');
            notice.textContent = message;
            notice.dataset.tone = tone || '';
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();
            if (response.ok) {
                localStorage.setItem('token', result.token);
                window.location.href = '/';
            } else {
                notify(result.error, 'error');
            }
        }

        async function signup() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const response = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();
            if (response.ok) {
                localStorage.setItem('token', result.token);
                window.location.href = '/';
            } else {
                notify(result.error, 'error');
            }
        }
    </script>
</body>
</html>
